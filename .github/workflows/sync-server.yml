name: Sync server

# The sync server (crates/smaragd-sync-server) is its own Cargo workspace with its
# own Cargo.lock, so it has its own workflow: it only runs when the server, the
# shared protocol crate, or the e2e crate (its own separate Cargo.lock too) changes,
# and it publishes the Docker image on version tags.

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
    paths:
      - "crates/smaragd-sync-server/**"
      - "crates/smaragd-sync-protocol/**"
      - "crates/smaragd-sync-e2e/**"
      - "src/sync/**"
      - ".github/workflows/sync-server.yml"
      - "scripts/sync-server-smoke-test.sh"
      # smaragd-sync-e2e path-depends on the root crate (it links the whole
      # desktop app), so it has its own standalone Cargo.lock that silently
      # drifts out of sync with it whenever a root dependency changes here —
      # Dependabot only watches the root `/` directory (.github/dependabot.yml),
      # so a bump here never otherwise touches a path this workflow watches.
      # Twice already (406b37de, and the run this comment's commit fixes), that
      # let a stale e2e lockfile merge to main unnoticed until something
      # unrelated finally touched src/sync/** and ran `cargo clippy --locked`
      # against it. Watching these two catches the drift on the bump's own PR
      # instead.
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "crates/smaragd-sync-server/**"
      - "crates/smaragd-sync-protocol/**"
      - "crates/smaragd-sync-e2e/**"
      - "src/sync/**"
      - ".github/workflows/sync-server.yml"
      - "scripts/sync-server-smoke-test.sh"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  test:
    name: Sync server (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/smaragd-sync-server

      - name: cargo fmt --check
        working-directory: crates/smaragd-sync-server
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: crates/smaragd-sync-server
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: crates/smaragd-sync-server
        run: cargo test --locked

  e2e:
    name: End-to-end (real client + real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/smaragd-sync-e2e

      # Links the whole desktop app plus the server, so it's about as heavy as the
      # main CI job; that's why it's a crate (and a job) of its own.
      - name: cargo fmt --check
        working-directory: crates/smaragd-sync-e2e
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: crates/smaragd-sync-e2e
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: crates/smaragd-sync-e2e
        run: cargo test --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/smaragd-sync-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      # Always builds (catching a broken Dockerfile on PRs) and loads the image locally
      # so it can be started and checked before anything is published.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/smaragd-sync-server/Dockerfile
          load: true
          tags: smaragd-sync-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the image as the self-hosting guide does: health check, /data permissions
      # for the non-root user, admin-token gate, `admin` via docker exec, restart.
      - name: Smoke test the image
        run: scripts/sync-server-smoke-test.sh smaragd-sync-server:ci

      # Tags only, and only after the smoke test passed; the layers come from the cache.
      - name: Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/smaragd-sync-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
