[package]
name = "smaragd"
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ljantzen/smaragd"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0"
docx-rs = "0.4.22"
eframe = "0.35"
egui = { version = "0.35", features = ["serde"] }
egui_dock = { version = "0.20", features = ["serde"] }
egui_extras = { version = "0.35.0", features = ["image", "file"] }
epub-builder = "0.8.3"
ignore = "0.4"
nucleo-matcher = "0.3"
pulldown-cmark = "0.13"
rfd = "0.17"
rhai = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
toml = "1.1"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15.1"
uuid = { version = "1.24", features = ["v4", "serde"] }
yrs = "0.27.3"

[build-dependencies]
resvg = "0.47"
tiny-skia = "0.12"
usvg = "0.47"

[dev-dependencies]
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
