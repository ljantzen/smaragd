app-id: io.github.ljantzen.Smaragd
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: smaragd
# The apt-installed flatpak-builder on ubuntu-22.04 predates appstreamcli's
# `compose` subcommand and still execs the standalone `appstream-compose`
# binary, which current appstream releases (as shipped by the 25.08 SDK) no
# longer provide. This bundle is a direct-download sideload rather than
# something served from a repo, so we don't need the composed AppStream
# catalog data - skip the step rather than fighting the tool-version skew.
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: smaragd
    buildsystem: simple
    # Builds from source with all crates.io dependencies vendored ahead of
    # time (cargo-sources.json, generated from Cargo.lock by
    # https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo),
    # so the build runs fully offline inside the sandbox - this is what
    # Flathub requires (no network access during build-commands).
    #
    # To regenerate cargo-sources.json after Cargo.lock changes:
    #   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
    build-commands:
      - CARGO_HOME=$PWD/cargo cargo build --offline --release --locked
      - install -Dm755 target/release/smaragd /app/bin/smaragd
      - sed 's/^Icon=smaragd$/Icon=io.github.ljantzen.Smaragd/' packaging/smaragd.desktop > io.github.ljantzen.Smaragd.desktop
      - install -Dm644 io.github.ljantzen.Smaragd.desktop /app/share/applications/io.github.ljantzen.Smaragd.desktop
      - install -Dm644 assets/smaragd-icon.svg /app/share/icons/hicolor/scalable/apps/io.github.ljantzen.Smaragd.svg
      - install -Dm644 packaging/flatpak/io.github.ljantzen.Smaragd.metainfo.xml /app/share/metainfo/io.github.ljantzen.Smaragd.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - dist
          - AppDir
          - flatpak-build
          - flatpak-repo
          - "*.AppImage"
          - smaragd.png
      - cargo-sources.json
