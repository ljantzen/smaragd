[package]
name = "smaragd"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ljantzen/smaragd"

[dependencies]
blake3 = "1.8.5"
bs58 = "0.5.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0"
docx-rs = "0.4.22"
eframe = "0.35"
egui = { version = "0.35", features = ["serde"] }
egui_dock = { version = "0.20", features = ["serde"] }
egui_extras = { version = "0.35.0", features = ["image", "file"] }
epub-builder = "0.8.3"
ignore = "0.4"
iroh = "1.0.3"
notify-rust = { version = "4.18.0", default-features = false, features = ["d_vendored"] }
nucleo-matcher = "0.3"
pdf-extract = "0.12.0"
postcard = { version = "1.1.3", features = ["use-std"] }
pulldown-cmark = "0.13"
quick-xml = "0.41"
rand = "0.10.2"
rfd = "0.17"
rhai = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sha2 = "0.11"
spellbook = "0.4.2"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros"] }
toml = "1.1"
ttf-parser = "0.25"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15.1"
ureq = "3.4"
uuid = { version = "1.24", features = ["v4", "serde"] }
yrs = "0.27.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
resvg = "0.48"
tiny-skia = "0.12"
usvg = "0.48"

[dev-dependencies]
tempfile = "3"
