[package]
name = "tachylite"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0"
docx-rs = "0.4.22"
eframe = "0.35"
egui = { version = "0.35", features = ["serde"] }
egui_dock = { version = "0.20", features = ["serde"] }
egui_extras = { version = "0.35.0", features = ["image", "file"] }
epub-builder = "0.8.3"
ignore = "0.4"
pulldown-cmark = "0.13"
rfd = "0.17"
rhai = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
toml = "1.1"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15.1"
uuid = { version = "1.24", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
