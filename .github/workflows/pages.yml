name: Deploy Pages

# Deployed only as part of a release (a `v`-prefixed version tag, the same
# pattern the `github-pages` environment's deployment rules allow), so the
# published manual and browser edition always match the latest released
# version rather than whatever is on `main`. Can still be run manually from
# the Actions tab.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Prerelease tags (e.g. `v1.3.0-rc1`) don't replace the live site.
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build the user manual
        run: mdbook build book-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - uses: taiki-e/install-action@trunk

      # Served from a GitHub Pages project site, so the app lives under
      # /smaragd/app/ rather than the domain root — trunk needs to know
      # that to emit correct asset URLs in the built index.html.
      - name: Build the browser edition
        run: trunk build --release --public-url /smaragd/app/

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          rm -f _site/user-manual.md
          mkdir -p _site/manual
          cp -r book-src/book/. _site/manual/
          mkdir -p _site/app
          cp -r dist/. _site/app/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4+ stopped including dotfiles by default; mdBook's own
          # `book-src/book/.nojekyll` (copied into _site/manual/) needs to
          # survive into the deployed artifact.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
