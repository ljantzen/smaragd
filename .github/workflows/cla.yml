name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read and agree to the Smaragd CLA (CLA.md).') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT_PAT }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ljantzen/smaragd/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ljantzen,dependabot[bot],dependabot-preview[bot]
          custom-pr-sign-comment: I have read and agree to the Smaragd CLA (CLA.md).
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before this pull request can be merged,
            please agree to our [Contributor License Agreement](https://github.com/ljantzen/smaragd/blob/main/CLA.md)
            by posting the following as a comment on this pull request:

            > I have read and agree to the Smaragd CLA (CLA.md).
          lock-pullrequest-aftermerge: false
