# Smaragd sync server — example compose file.
#
#   export SMARAGD_SYNC_ADMIN_TOKEN="$(openssl rand -hex 24)"
#   docker compose up -d
#
# Plain HTTP on :8080; put a TLS-terminating reverse proxy in front for anything
# beyond your own machine (see README.md). All state lives in the `sync-data` volume.
services:
  smaragd-sync:
    # Build locally from the repo root ...
    build:
      context: ../..
      dockerfile: crates/smaragd-sync-server/Dockerfile
    # ... or comment `build` out and pull a published image instead:
    image: ghcr.io/ljantzen/smaragd-sync-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Needed to create vaults while open registration is off (recommended).
      SMARAGD_SYNC_ADMIN_TOKEN: ${SMARAGD_SYNC_ADMIN_TOKEN:?set SMARAGD_SYNC_ADMIN_TOKEN}
      SMARAGD_SYNC_ALLOW_OPEN_REGISTRATION: "false"
      SMARAGD_SYNC_VAULT_QUOTA_MB: "1024"
    volumes:
      - sync-data:/data

volumes:
  sync-data:
