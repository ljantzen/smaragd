name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Lets linuxdeploy (and any AppImage plugins it spawns) run without FUSE,
  # which isn't available on GitHub-hosted runners.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  release:
    name: Build and release (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libssl-dev \
            libspeechd-dev \
            librsvg2-bin

      - name: Determine version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package executable
        run: |
          mkdir -p dist
          tar -czf "dist/smaragd-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz" \
            -C target/release smaragd

      - name: Render application icon
        run: rsvg-convert -w 512 -h 512 assets/smaragd-icon.svg -o smaragd.png

      - name: Download linuxdeploy
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e target/release/smaragd \
            -d packaging/smaragd.desktop \
            -i smaragd.png \
            --output appimage

          appimage_file=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*')
          mv "$appimage_file" "dist/smaragd-${VERSION}-x86_64.AppImage"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS-x86_64-linux

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true

  release-windows:
    name: Build and release (Windows x86_64)
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Determine version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package executable
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp target/release/smaragd.exe smaragd.exe
          7z a "dist/smaragd-${VERSION}-x86_64-windows.zip" smaragd.exe

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: sha256sum * > SHA256SUMS-x86_64-windows

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true

  release-macos:
    name: Build and release (macOS universal)
    needs: release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Determine version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries (arm64 + x86_64)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Combine into universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/smaragd \
            target/x86_64-apple-darwin/release/smaragd \
            -output target/universal-apple-darwin/release/smaragd

      - name: Install icon tooling
        run: brew install librsvg

      - name: Render app icon (.icns)
        run: |
          set -euo pipefail
          mkdir -p AppIcon.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w "$size" -h "$size" assets/smaragd-icon.svg -o "AppIcon.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            rsvg-convert -w "$double" -h "$double" assets/smaragd-icon.svg -o "AppIcon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Assemble Smaragd.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APP="Smaragd.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal-apple-darwin/release/smaragd "$APP/Contents/MacOS/smaragd"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist.template > "$APP/Contents/Info.plist"

      - name: Sign app bundle (ad-hoc)
        run: codesign --force --deep --sign - Smaragd.app

      - name: Package app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent Smaragd.app "dist/smaragd-${VERSION}-universal-macos.zip"

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 * > SHA256SUMS-universal-macos

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
