[package]
name = "smaragd"
version = "1.6.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A native desktop authoring tool for writers"
repository = "https://github.com/smaragd-editor/smaragd"

[dependencies]
smaragd-core = { path = "../core" }
# OS clipboard image access for pasting images into the editor (src/clipboard.rs).
# `wayland-data-control`: without it, arboard only speaks X11 and can't see a
# Wayland app's (e.g. a browser's) clipboard image on a native Wayland session.
arboard = { version = "3.6", features = ["wayland-data-control"] }
bs58 = "0.5.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6.0"
eframe = "0.36"
egui = { version = "0.36", features = ["serde"] }
egui_dock = { version = "0.21", features = ["serde"] }
egui_extras = { version = "0.36.1", features = ["image", "file"] }
egui_plot = "0.37"
# PNG-encoding clipboard images for pasting into the editor (src/clipboard.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = { version = "4.18.0", default-features = false, features = ["d_vendored"] }
rfd = "0.17"
# "Open in default app" / "Show in system explorer" in the editor's ☰ menu.
opener = { version = "0.9", features = ["reveal"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rhai = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smaragd-sync-protocol = { git = "https://github.com/smaragd-editor/smaragd-sync" }
toml = "1.1"
ttf-parser = "0.25"
uuid = { version = "1.24", features = ["v4", "serde", "rng-getrandom"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
smaragd-core = { path = "../core", features = ["test-support"] }

# Debian package metadata, consumed by `cargo deb` in the release workflow.
[package.metadata.deb]
maintainer = "Leif Jantzen <ljantzen@gmail.com>"
copyright = "2025, Leif Jantzen"
license-file = ["LICENSE", "0"]
extended-description = """\
Smaragd is a native desktop authoring tool for writers. A project is a \
folder of Markdown files with dockable views, a binder tree, bookmarks, \
a quick-switcher, and export to PDF/EPUB/DOCX."""
section = "editors"
priority = "optional"
depends = "$auto"
assets = [
    ["../target/release/smaragd", "usr/bin/", "755"],
    ["../packaging/smaragd.desktop", "usr/share/applications/smaragd.desktop", "644"],
    ["../assets/smaragd-icon.png", "usr/share/icons/hicolor/256x256/apps/smaragd.png", "644"],
]

# RPM package metadata, consumed by `cargo generate-rpm` in the release workflow.
[package.metadata.generate-rpm]
assets = [
    { source = "../target/release/smaragd", dest = "/usr/bin/smaragd", mode = "755" },
    { source = "../packaging/smaragd.desktop", dest = "/usr/share/applications/smaragd.desktop", mode = "644" },
    { source = "../assets/smaragd-icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/smaragd.png", mode = "644" },
]
