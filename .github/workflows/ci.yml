name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --all-features

      # The sync protocol crate is shared with the browser build, so it must
      # keep compiling for wasm32.
      - name: Check sync protocol crate builds for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p smaragd-sync-protocol --target wasm32-unknown-unknown

  flatpak-sources:
    name: Flatpak vendored sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # packaging/flatpak/cargo-sources.json is a vendored snapshot of
      # Cargo.lock's dependencies that only the release workflow's flatpak
      # build reads. Nothing regenerates it automatically (e.g. a
      # Dependabot bump), so it drifts silently until a release build fails
      # months later. Regenerate it here and fail if that changes anything,
      # so drift is caught on the PR that introduced it instead.
      - name: Regenerate and diff cargo-sources.json
        run: |
          ./scripts/update-flatpak-sources.sh
          git diff --exit-code packaging/flatpak/cargo-sources.json

  coverage:
    name: Coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Prints a per-file summary table to the log (so coverage is visible
      # without downloading anything) and writes an lcov report in the same
      # run, rather than re-running the whole suite twice for each format.
      - name: cargo llvm-cov
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov.info
          path: lcov.info
