[package]
name = "tachylite"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0"
eframe = "0.35"
egui = { version = "0.35", features = ["serde"] }
egui_extras = { version = "0.35.0", features = ["image", "file"] }
ignore = "0.4"
pulldown-cmark = "0.13"
rfd = "0.17"
rhai = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
toml = "1.1"
uuid = { version = "1.24", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
