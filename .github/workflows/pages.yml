name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book-src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Build the user manual
        run: mdbook build book-src

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          rm -f _site/user-manual.md
          mkdir -p _site/manual
          cp -r book-src/book/. _site/manual/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
